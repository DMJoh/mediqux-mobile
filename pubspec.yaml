name: mediqux_mobile
description: Mediqux - Medical records and patient management mobile app.
publish_to: 'none'

version: 0.0.7-alpha+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  equatable: ^2.0.7
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.10+1
  go_router: ^14.6.3
  google_fonts: ^6.2.1
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.5.0
  open_file: ^3.5.9
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  retrofit: ^4.4.2
  riverpod_annotation: ^4.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  retrofit_generator: ^10.1.1
  riverpod_generator: ^4.0.0
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: 'assets/icon.png'
  adaptive_icon_background: '#0D47A1'
  adaptive_icon_foreground: 'assets/icon.png'
  min_sdk_android: 21
